name: Node.js Backend CI

on:
  push:
    branches: [ "main", "security-hardening" ]
    paths: [ "server/**", "scripts/**", ".github/workflows/server.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "server/**", "scripts/**", ".github/workflows/server.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: './server/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Legacy cloud SDK scan
      run: npm run check:legacy

    - name: Build and test
      run: npm test
