name: Android CI Build

on:
  push:
    branches: [ "main", "mumbai-launch-*", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./android-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The release variant is what ships (R8, resource shrinking, release-only checks), so CI
    # lints, tests and builds that - not debug. Without a keystore secret the APK is unsigned.
    - name: Run Lint (release)
      run: ./gradlew lintRelease

    - name: Run Unit Tests (release)
      run: ./gradlew testReleaseUnitTest

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: android-app/app/build/outputs/apk/release/*.apk
